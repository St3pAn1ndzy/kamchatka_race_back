{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="card">
  <div class="card-header">
    <h3 class="card-title"><i class="fa-solid fa-route me-2 text-primary"></i>Маршрут гонки</h3>
  </div>
  <div class="card-body p-0">
    <div id="routeMap" style="height:480px;width:100%;"></div>
  </div>
</div>

<div class="row g-3 mt-1">
  <div class="col-md-4">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Этапы</h4></div>
      <div class="card-body p-0">
        <div class="list-group list-group-flush" id="stageList">
          {% for s in stages %}
          <button class="list-group-item list-group-item-action d-flex align-items-center gap-2 stage-btn"
                  data-stage-id="{{ s.id }}"
                  data-name="{{ s.name }}"
                  data-route='{{ s.route_points | tojson if s.route_points else "[]" }}'
                  data-checkpoints='{{ s.checkpoints | tojson if s.checkpoints else "[]" }}'>
            <span class="badge bg-primary rounded-pill">{{ s.number }}</span>
            <span>{{ s.name }}</span>
            <span class="ms-auto text-muted small">{{ s.distance_km }} км</span>
          </button>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Контрольные пункты</h4></div>
      <div class="card-body">
        <table class="table table-sm" id="cpTable">
          <thead><tr><th>Код</th><th>Название</th></tr></thead>
          <tbody id="cpBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block tail %}
{{ super() }}
<script>
(function(){
  var routeLayer, cpLayer;

  ymaps.ready(function(){
    var map = new ymaps.Map('routeMap', {
      center: [53.0, 158.7],
      zoom: 7,
      controls: ['zoomControl']
    });

    function applyStage(btn){
      if (routeLayer) { map.geoObjects.remove(routeLayer); }
      if (cpLayer) { map.geoObjects.remove(cpLayer); }
      document.getElementById('cpBody').innerHTML = '';
      var cpHtml = '', bounds = [];

      // Маршрут
      try {
        var routeData = JSON.parse(btn.getAttribute('data-route') || '[]');
        if (routeData.length) {
          var coords = routeData.map(function(p){ return [p.lat, p.lon]; });
          routeLayer = new ymaps.Polyline(coords, {}, {
            strokeColor: '#005A9C', strokeWidth: 3
          });
          map.geoObjects.add(routeLayer);
          bounds = bounds.concat(coords);
        }
      } catch(e) {}

      // КП
      try {
        var cpData = JSON.parse(btn.getAttribute('data-checkpoints') || '[]');
        cpLayer = new ymaps.GeoObjectCollection();
        cpData.forEach(function(cp){
          var pt = [cp.lat, cp.lon];
          bounds.push(pt);
          var color = cp.kind === 'start' ? '#2fb344' : cp.kind === 'finish' ? '#d63939' : '#f59f00';
          var pm = new ymaps.Placemark(pt, {
            hintContent: cp.code + ' — ' + cp.name
          }, {
            preset: 'islands#circleDotIcon',
            iconColor: color
          });
          cpLayer.add(pm);
          cpHtml += '<tr><td><span class="badge" style="background:'+color+'">'+cp.code+'</span></td><td>'+cp.name+'</td></tr>';
        });
        map.geoObjects.add(cpLayer);
        document.getElementById('cpBody').innerHTML = cpHtml;
      } catch(e) {}

      if (bounds.length) {
        map.setBounds(bounds, {checkZoomRange:true, zoomMargin:30});
      }
    }

    var btns = document.querySelectorAll('.stage-btn');
    btns.forEach(function(btn){
      btn.addEventListener('click', function(){
        btns.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        applyStage(btn);
      });
    });
    if (btns.length) applyStage(btns[0]);
  });
})();
</script>
{% endblock %}
