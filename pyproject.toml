[project]
name = "kamchatka-race-back"
version = "0.1.0"
description = ""
authors = [
    {name = "Stepan Obukhov",email = "stepanobukhov2009@gmail.com"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.54,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "sqladmin (>=0.32.0,<0.33.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "celery (>=5.6.3,<6.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)"
]


[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (сортировка импортов)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (устаревший синтаксис)
    "SIM", # flake8-simplify
]

ignore = [
    "B008",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"