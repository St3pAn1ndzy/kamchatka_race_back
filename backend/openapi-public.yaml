components:
  schemas:
    AdminLoginRequest:
      properties:
        login:
          type: string
          title: Login
        password:
          type: string
          title: Password
      type: object
      required:
      - login
      - password
      title: AdminLoginRequest
    AdminMe:
      properties:
        id:
          type: integer
          title: Id
        display_name:
          type: string
          title: Display Name
        login:
          anyOf:
          - type: string
          - type: 'null'
          title: Login
      type: object
      required:
      - id
      - display_name
      title: AdminMe
    AdminTokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        admin_id:
          type: integer
          title: Admin Id
        display_name:
          type: string
          title: Display Name
      type: object
      required:
      - access_token
      - expires_in
      - admin_id
      - display_name
      title: AdminTokenResponse
    AssignDeviceRequest:
      properties:
        imei:
          type: string
          title: Imei
        participant_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Participant Id
        stage_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Stage Id
      type: object
      required:
      - imei
      title: AssignDeviceRequest
    BroadcastRequest:
      properties:
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        participant_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Participant Id
          description: Если указано — только болельщикам этого участника
      type: object
      required:
      - title
      - body
      title: BroadcastRequest
    CheckpointOut:
      properties:
        id:
          type: integer
          title: Id
        stage_id:
          type: integer
          title: Stage Id
        name:
          type: string
          title: Name
        lat:
          type: number
          title: Lat
        lon:
          type: number
          title: Lon
        order_index:
          type: integer
          title: Order Index
        has_judge:
          type: boolean
          title: Has Judge
      type: object
      required:
      - id
      - stage_id
      - name
      - lat
      - lon
      - order_index
      - has_judge
      title: CheckpointOut
    CorrectMarkRequest:
      properties:
        mark_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Mark Time
        penalty_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Penalty Minutes
        mandatory_stop_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Mandatory Stop Minutes
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        reason:
          type: string
          title: Reason
          description: Причина корректировки (обязательно)
      type: object
      required:
      - reason
      title: CorrectMarkRequest
    CreateMarkRequest:
      properties:
        participant_id:
          type: integer
          title: Participant Id
        checkpoint_id:
          type: integer
          title: Checkpoint Id
        mark_time:
          type: string
          format: date-time
          title: Mark Time
        penalty_minutes:
          type: integer
          title: Penalty Minutes
          default: 0
        mandatory_stop_minutes:
          type: integer
          title: Mandatory Stop Minutes
          default: 0
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      type: object
      required:
      - participant_id
      - checkpoint_id
      - mark_time
      title: CreateMarkRequest
    DashboardStats:
      properties:
        race_status:
          type: string
          title: Race Status
        active_participants:
          type: integer
          title: Active Participants
        devices_online:
          type: integer
          title: Devices Online
        devices_sos:
          type: integer
          title: Devices Sos
