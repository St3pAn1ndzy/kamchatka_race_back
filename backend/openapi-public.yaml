openapi: 3.1.0
info:
  title: Avacha Race — Public API (for VK Mini App frontend)
  version: 1.0.0
  description: 'Публичное API мини-приложения ВКонтакте «Авача» (гонка на собачьих
    упряжках, Камчатка).


    **Базовый URL**: `/api/v1`


    **Важные инварианты (из брифа):**

    - Официальное время — только судейские отметки (`OfficialMark`). Точки трека —
    для визуализации.

    - Положение участника — последняя подтверждённая точка с `recorded_at`.

    - Свежесть данных: `fresh / delayed / stale / no_data`.

    - **В публичном API НЕТ полей `sos` и `battery_percent`** (только в админке).

    - Интервал передачи — параметр этапа, не константа.

    - Формат дат: ISO 8601 с таймзоной (e.g. `2026-12-01T10:32:00+12:00`).


    Авторизация пользователя — JWT в `Authorization: Bearer <token>` после `/auth/vk`.

    Админские эндпоинты `/api/v1/admin/*` в эту спецификацию не включены.'
paths:
  /api/v1/auth/vk:
    post:
      tags:
      - auth
      summary: Auth Vk
      operationId: auth_vk_api_v1_auth_vk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VKAuthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
